name: Bug report
description: A kongkow command did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please write in English. Remove tokens, chat IDs and other secrets before you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The kongkow command you ran, and its output. An AI agent can paste this for you.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kongkow version
      description: Run `kongkow version`
      placeholder: v0.0.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your computer's OS
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11 with WSL
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Destination kind (if it matters)
      description: file, telegram, or another kind you used
      placeholder: telegram
