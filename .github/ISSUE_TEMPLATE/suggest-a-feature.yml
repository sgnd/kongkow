name: Suggest a feature
description: A task you want kongkow to do for you or your AI agent
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: The task, not the solution. For example "schedule a post to Telegram every Monday".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The tools or commands you use now (a notes app, a bot script, Telegram itself, ...)
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could kongkow help?
      description: Optional. A command you imagine, like `kongkow post schedule hello --to tg --cron '0 9 * * 1'`.
  - type: checkboxes
    id: rules
    attributes:
      label: Does it fit kongkow?
      description: See [CONTRIBUTING.md](https://github.com/sgnd/kongkow/blob/main/CONTRIBUTING.md#before-you-add-something).
      options:
        - label: It is about local content, publish destinations or the local vault — not SSH, servers or DevOps (that is komando)
          required: true
        - label: It can work as a plain command, for a person and for an AI agent (no windows)
          required: true
